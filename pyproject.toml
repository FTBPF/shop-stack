[project]
name = "shop-stack"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "franc-LENOVO", email = "franciscofigueiredo2580@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "click>=8.5.1",
    "duckdb>=2.0.0",
    "google-cloud-bigquery>=3.47.0",
    "pandas>=3.1.1",
    "psycopg[binary]>=3.3.8",
    "pyarrow>=26.0.1",
    "sqlalchemy>=2.1.8",
]

[project.scripts]
shop = "shop_stack:main"

[build-system]
requires = ["uv_build>=0.11.23,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.uv]
exclude-newer = "P7D"
